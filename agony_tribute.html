<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agony Tribute - Owl Shooter</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a1a; overflow: hidden; font-family: 'Courier New', monospace; }
        canvas { display: block; }
        #ui { position: absolute; top: 10px; left: 10px; color: #fff; font-size: 18px; text-shadow: 2px 2px 4px #000; z-index: 100; }
        #gameOver { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; text-align: center; display: none; z-index: 200; }
        #gameOver h1 { font-size: 48px; color: #ff4444; text-shadow: 3px 3px 6px #000; margin-bottom: 20px; }
        #gameOver button { padding: 15px 40px; font-size: 20px; background: linear-gradient(180deg, #4a4a8a, #2a2a5a); color: #fff; border: 2px solid #6a6aaa; cursor: pointer; font-family: 'Courier New', monospace; transition: all 0.3s; }
        #gameOver button:hover { background: linear-gradient(180deg, #5a5a9a, #3a3a6a); transform: scale(1.1); }
        #healthBar { width: 200px; height: 20px; background: #333; border: 2px solid #666; margin-top: 5px; }
        #healthFill { width: 100%; height: 100%; background: linear-gradient(90deg, #ff4444, #ff8844); transition: width 0.3s; }
    </style>
</head>
<body>
    <div id="ui">
        <div>SCORE: <span id="score">0</span></div>
        <div id="healthBar"><div id="healthFill"></div></div>
    </div>
    <div id="gameOver">
        <h1>GAME OVER</h1>
        <p style="margin-bottom: 20px; font-size: 24px;">Final Score: <span id="finalScore">0</span></p>
        <button onclick="restartGame()">RESTART</button>
    </div>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Initialize player position after canvas is sized
        player.y = canvas.height / 2;

        let frameCount = 0;
        let gameRunning = true;
        let score = 0;
        let playerHealth = 100;
        let maxHealth = 100;

        const player = {
            x: 100,
            y: 0,
            width: 50,
            height: 35,
            vx: 0,
            vy: 0,
            wingAngle: 0,
            wingSpeed: 0.15,
            hasSword: false,
            swordAngle: 0,
            trail: []
        };

        const keys = {};
        const mouse = { x: null, y: null, active: false };

        document.addEventListener('keydown', e => keys[e.key] = true);
        document.addEventListener('keyup', e => keys[e.key] = false);
        document.addEventListener('mousemove', e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            mouse.active = true;
        });

        let projectiles = [];
        let enemies = [];
        let particles = [];
        let powerups = [];
        let swords = [];

        const parallaxLayers = [
            { speed: 0.3, elements: [], type: 'mountains', color: '#1a1a3a' },
            { speed: 0.6, elements: [], type: 'hills', color: '#2a2a4a' },
            { speed: 1.0, elements: [], type: 'trees', color: '#3a3a5a' }
        ];

        function generateParallaxElements() {
            parallaxLayers.forEach(layer => {
                layer.elements = [];
                const count = layer.type === 'mountains' ? 8 : layer.type === 'hills' ? 12 : 20;
                for (let i = 0; i < count; i++) {
                    layer.elements.push({
                        x: Math.random() * canvas.width * 2,
                        y: canvas.height - (layer.type === 'mountains' ? 150 + Math.random()*200 : layer.type === 'hills' ? 80 + Math.random()*100 : 50 + Math.random()*60),
                        width: layer.type === 'mountains' ? 200 + Math.random()*300 : layer.type === 'hills' ? 100 + Math.random()*150 : 30 + Math.random()*50,
                        height: layer.type === 'mountains' ? 200 + Math.random()*300 : layer.type === 'hills' ? 100 + Math.random()*150 : 60 + Math.random()*80
                    });
                }
            });
        }
        generateParallaxElements();

        function drawMountains(x, y, width, height, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(x, canvas.height);
            const peaks = 5;
            for (let i = 0; i <= peaks; i++) {
                const px = x + (i/peaks)*width;
                const py = y - Math.sin(i*2.5)*50 - Math.cos(i*1.7)*30;
                ctx.lineTo(px, py);
            }
            ctx.lineTo(x+width, canvas.height);
            ctx.closePath();
            ctx.fill();
        }

        function drawTree(x, y, width, height, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x+width/2-5, y, 10, height);
            for (let i = 0; i < 4; i++) {
                const branchY = y+20+i*15;
                const branchLen = 20-i*3;
                const angle = i%2===0 ? -0.5 : 0.5;
                ctx.save();
                ctx.translate(x+width/2, branchY);
                ctx.rotate(angle);
                ctx.fillRect(0, -3, branchLen, 6);
                ctx.restore();
            }
            ctx.beginPath();
            ctx.arc(x+width/2, y-10, 25, 0, Math.PI*2);
            ctx.fill();
        }

        function drawParallax() {
            parallaxLayers.forEach(layer => {
                layer.elements.forEach(el => {
                    if (layer.type === 'mountains' || layer.type === 'hills') {
                        drawMountains(el.x, el.y, el.width, el.height, layer.color);
                    } else {
                        drawTree(el.x, el.y, el.width, el.height, layer.color);
                    }
                });
            });
        }

        function updateParallax() {
            parallaxLayers.forEach(layer => {
                layer.elements.forEach(el => {
                    el.x -= layer.speed;
                    if (el.x + el.width < 0) {
                        el.x = canvas.width + Math.random()*200;
                    }
                });
            });
        }

        function drawOwlBody(x, y, wingAngle, bodyColor) {
            ctx.save();
            ctx.translate(x, y);
            
            ctx.fillStyle = bodyColor;
            ctx.beginPath();
            ctx.ellipse(0, 0, 25, 15, 0, 0, Math.PI*2);
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(15, -8, 12, 0, Math.PI*2);
            ctx.fill();
            
            ctx.fillStyle = '#ffaa00';
            ctx.beginPath();
            ctx.arc(18, -10, 4, 0, Math.PI*2);
            ctx.fill();
            
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(19, -10, 2, 0, Math.PI*2);
            ctx.fill();
            
            ctx.fillStyle = '#ff8800';
            ctx.beginPath();
            ctx.moveTo(25, -6);
            ctx.lineTo(35, -4);
            ctx.lineTo(25, -2);
            ctx.closePath();
            ctx.fill();
            
            ctx.fillStyle = bodyColor;
            ctx.save();
            ctx.translate(-5, 0);
            ctx.rotate(Math.sin(wingAngle)*0.4);
            ctx.beginPath();
            ctx.ellipse(-10, -5, 18, 8, -0.3, 0, Math.PI*2);
            ctx.fill();
            ctx.restore();
            
            ctx.save();
            ctx.translate(-5, 5);
            ctx.rotate(-Math.sin(wingAngle)*0.4);
            ctx.beginPath();
            ctx.ellipse(-10, 5, 18, 8, 0.3, 0, Math.PI*2);
            ctx.fill();
            ctx.restore();
            
            ctx.fillStyle = bodyColor;
            ctx.beginPath();
            ctx.moveTo(-20, 0);
            ctx.lineTo(-35, -5);
            ctx.lineTo(-35, 5);
            ctx.closePath();
            ctx.fill();
            
            ctx.restore();
        }

        function drawPlayer() {
            player.trail.push({ x: player.x, y: player.y, wingAngle: player.wingAngle });
            if (player.trail.length > 8) player.trail.shift();
            
            player.trail.forEach((trail, index) => {
                const alpha = (index/player.trail.length)*0.4;
                ctx.globalAlpha = alpha;
                drawOwlBody(trail.x-5, trail.y, trail.wingAngle, '#6a8aaa');
                ctx.globalAlpha = 1.0;
            });
            
            drawOwlBody(player.x, player.y, player.wingAngle, '#dda');
        }

        function updatePlayer() {
            player.wingAngle += player.wingSpeed;
            
            const targetX = mouse.active ? mouse.x - 50 : player.x;
            const targetY = mouse.active ? mouse.y : player.y;
            
            if (keys['ArrowUp'] || keys['w']) player.vy -= 0.5;
            if (keys['ArrowDown'] || keys['s']) player.vy += 0.5;
            if (keys['ArrowLeft'] || keys['a']) player.vx -= 0.5;
            if (keys['ArrowRight'] || keys['d']) player.vx += 0.5;
            
            if (mouse.active) {
                player.x += (targetX - player.x)*0.08;
                player.y += (targetY - player.y)*0.08;
            } else {
                player.x += player.vx;
                player.y += player.vy;
            }
            
            player.vx *= 0.92;
            player.vy *= 0.92;
            
            player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
            player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));
            
            if (frameCount % 15 === 0) {
                projectiles.push({ x: player.x+40, y: player.y, vx: 12, vy: 0, width: 15, height: 4 });
            }
            
            if (player.hasSword) {
                player.swordAngle += 0.1;
                swords = [
                    { x: player.x + Math.cos(player.swordAngle)*50, y: player.y + Math.sin(player.swordAngle)*50, angle: player.swordAngle },
                    { x: player.x + Math.cos(player.swordAngle+Math.PI)*50, y: player.y + Math.sin(player.swordAngle+Math.PI)*50, angle: player.swordAngle+Math.PI }
                ];
            }
        }

        function drawProjectiles() {
            ctx.fillStyle = '#aaffff';
            projectiles.forEach(proj => {
                ctx.beginPath();
                ctx.ellipse(proj.x, proj.y, proj.width/2, proj.height/2, 0, 0, Math.PI*2);
                ctx.fill();
                ctx.shadowColor = '#aaffff';
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.shadowBlur = 0;
            });
        }

        function updateProjectiles() {
            projectiles.forEach((proj, index) => {
                proj.x += proj.vx;
                if (proj.x > canvas.width) projectiles.splice(index, 1);
            });
        }

        function spawnEnemy() {
            const y = Math.random()*(canvas.height-60)+30;
            enemies.push({
                x: canvas.width+50,
                y: y,
                width: 40,
                height: 30,
                vx: -3-Math.random()*2,
                vy: 0,
                phase: Math.random()*Math.PI*2,
                frequency: 0.02+Math.random()*0.03,
                amplitude: 30+Math.random()*50,
                baseY: y,
                health: 1
            });
        }

        function drawEnemy(enemy) {
            ctx.fillStyle = '#2a1a3a';
            ctx.save();
            ctx.translate(enemy.x, enemy.y);
            
            ctx.beginPath();
            ctx.ellipse(0, 0, enemy.width/2, enemy.height/2, 0, 0, Math.PI*2);
            ctx.fill();
            
            ctx.fillStyle = '#ff44aa';
            ctx.beginPath();
            ctx.arc(-10, -5, 4, 0, Math.PI*2);
            ctx.arc(-10, 5, 4, 0, Math.PI*2);
            ctx.fill();
            
            ctx.fillStyle = '#3a2a4a';
            for (let i = 0; i < 5; i++) {
                const wx = -enemy.width/2+i*8;
                const wy = (Math.random()-0.5)*enemy.height;
                ctx.beginPath();
                ctx.arc(wx, wy, 6, 0, Math.PI*2);
                ctx.fill();
            }
            
            ctx.restore();
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 15; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random()-0.5)*10,
                    vy: (Math.random()-0.5)*10,
                    life: 1.0,
                    color: color,
                    size: 3+Math.random()*5
                });
            }
        }

        function updateEnemies() {
            enemies.forEach((enemy, eIndex) => {
                enemy.x += enemy.vx;
                enemy.y = enemy.baseY + Math.sin(frameCount*enemy.frequency+enemy.phase)*enemy.amplitude;
                
                projectiles.forEach((proj, pIndex) => {
                    if (Math.abs(proj.x-enemy.x) < enemy.width/2+proj.width/2 && Math.abs(proj.y-enemy.y) < enemy.height/2+proj.height/2) {
                        createExplosion(enemy.x, enemy.y, '#aa44ff');
                        enemies.splice(eIndex, 1);
                        projectiles.splice(pIndex, 1);
                        score += 100;
                        document.getElementById('score').textContent = score;
                        if (Math.random() < 0.1) {
                            powerups.push({ x: enemy.x, y: enemy.y, width: 30, height: 30, vy: -2 });
                        }
                    }
                });
                
                if (player.hasSword) {
                    swords.forEach(sword => {
                        if (Math.abs(sword.x-enemy.x) < enemy.width/2+10 && Math.abs(sword.y-enemy.y) < enemy.height/2+10) {
                            createExplosion(enemy.x, enemy.y, '#aaffaa');
                            enemies.splice(eIndex, 1);
                            score += 100;
                            document.getElementById('score').textContent = score;
                        }
                    });
                }
                
                if (Math.abs(player.x-enemy.x) < (player.width+enemy.width)/2-10 && Math.abs(player.y-enemy.y) < (player.height+enemy.height)/2-10) {
                    enemies.splice(eIndex, 1);
                    createExplosion(enemy.x, enemy.y, '#ff4444');
                    playerHealth -= 20;
                    updateHealthBar();
                    if (playerHealth <= 0) gameOver();
                }
                
                if (enemy.x < -50) enemies.splice(eIndex, 1);
            });
        }

        function drawParticles() {
            particles.forEach(particle => {
                ctx.globalAlpha = particle.life;
                ctx.fillStyle = particle.color;
                ctx.beginPath();
                ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI*2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            });
        }

        function updateParticles() {
            particles.forEach((particle, index) => {
                particle.x += particle.vx;
                particle.y += particle.vy;
                particle.vy += 0.2;
                particle.life -= 0.03;
                if (particle.life <= 0) particles.splice(index, 1);
            });
        }

        function drawPowerups() {
            powerups.forEach(powerup => {
                ctx.fillStyle = '#ffdd44';
                ctx.save();
                ctx.translate(powerup.x, powerup.y);
                
                ctx.fillRect(-3, -15, 6, 25);
                ctx.fillRect(-8, 8, 16, 4);
                ctx.fillRect(-4, 12, 8, 8);
                
                ctx.shadowColor = '#ffdd44';
                ctx.shadowBlur = 15;
                ctx.fillRect(-3, -15, 6, 25);
                ctx.shadowBlur = 0;
                
                ctx.restore();
            });
        }

        function updatePowerups() {
            powerups.forEach((powerup, index) => {
                powerup.y += powerup.vy;
                powerup.vy *= 0.98;
                
                if (Math.abs(player.x-powerup.x) < (player.width+powerup.width)/2 && Math.abs(player.y-powerup.y) < (player.height+powerup.height)/2) {
                    player.hasSword = true;
                    powerups.splice(index, 1);
                    score += 500;
                    document.getElementById('score').textContent = score;
                }
                
                if (powerup.y < -50 || powerup.y > canvas.height+50) {
                    powerups.splice(index, 1);
                }
            });
        }

        function drawSwords() {
            if (!player.hasSword) return;
            
            swords.forEach(sword => {
                ctx.fillStyle = '#aaddff';
                ctx.save();
                ctx.translate(sword.x, sword.y);
                ctx.rotate(sword.angle+Math.PI/2);
                
                ctx.fillRect(-3, -20, 6, 35);
                ctx.fillRect(-10, 12, 20, 5);
                ctx.fillRect(-4, 17, 8, 10);
                
                ctx.shadowColor = '#aaddff';
                ctx.shadowBlur = 10;
                ctx.fillRect(-3, -20, 6, 35);
                ctx.shadowBlur = 0;
                
                ctx.restore();
            });
        }

        function updateHealthBar() {
            const healthPercent = (playerHealth/maxHealth)*100;
            document.getElementById('healthFill').style.width = healthPercent + '%';
        }

        function gameOver() {
            gameRunning = false;
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOver').style.display = 'block';
        }

        function restartGame() {
            gameRunning = true;
            score = 0;
            playerHealth = maxHealth;
            player.x = 100;
            player.y = canvas.height/2;
            player.vx = 0;
            player.vy = 0;
            player.hasSword = false;
            player.trail = [];
            projectiles = [];
            enemies = [];
            particles = [];
            powerups = [];
            swords = [];
            frameCount = 0;
            document.getElementById('score').textContent = '0';
            document.getElementById('gameOver').style.display = 'none';
            updateHealthBar();
            generateParallaxElements();
        }

        let enemySpawnTimer = 0;

        function gameLoop() {
            if (!gameRunning) {
                requestAnimationFrame(gameLoop);
                return;
            }
            
            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            updateParallax();
            drawParallax();
            
            updatePlayer();
            drawPlayer();
            
            updateProjectiles();
            drawProjectiles();
            
            if (frameCount % 60 === 0) {
                spawnEnemy();
            }
            updateEnemies();
            enemies.forEach(drawEnemy);
            
            updatePowerups();
            drawPowerups();
            
            drawSwords();
            
            updateParticles();
            drawParticles();
            
            frameCount++;
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
